services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [foodresq-mongo:/data/db]
    ports: ["27017:27017"]
  api:
    build: ./apps/api
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/foodresq
    ports: ["4000:4000"]
    depends_on: [mongo]
  web:
    build: ./apps/web
    ports: ["5173:80"]
    depends_on: [api]
  ai:
    build: ./services/ai
    env_file: .env
    ports: ["8000:8000"]
volumes:
  foodresq-mongo:
